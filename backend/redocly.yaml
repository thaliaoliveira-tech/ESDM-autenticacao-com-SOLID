# Configuracao do `npm run docs:lint`.
extends:
  - recommended

rules:
  # O unico servidor deste POC e o local. Apontar para um dominio ficticio de
  # producao seria menos honesto do que manter localhost.
  no-server-example.com: off

# Avisos que permanecem de proposito, e por que:
#
#   operation-4xx-response em POST /auth/guest e GET /health
#     Nao recebem entrada nem exigem autenticacao: nao existe 4XX natural.
#
# As regras continuam ligadas porque sao uteis nos demais endpoints;
# silencia-las globalmente esconderia lacunas reais em outro lugar.
