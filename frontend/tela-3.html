<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Crie sua conta do Sintetiza.">
  <title>Criar conta — Sintetiza</title>
  <link rel="icon" type="image/svg+xml" href="/assets/images/sintetiza.svg">
  <link rel="preload" href="/assets/fonts/Inter-Variable.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="/vendor/tailwind.min.css">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body data-page="register">
  <main class="panel register" aria-labelledby="page-title">
    <div data-status-bar class="status-bar flex items-center justify-between" aria-hidden="true"></div>
    <a class="back-link flex items-center justify-center" href="/index.html" aria-label="Voltar à tela inicial"><svg aria-hidden="true"><use href="/assets/icons/ui.svg#back"></use></svg></a>
    <div class="page-content">
      <header class="auth-brand flex flex-col items-center text-center">
        <img class="brand-mark" src="/assets/images/sintetiza.svg" width="64" height="64" alt="">
        <h1 class="brand-name">Sintetiza</h1>
      </header>
      <div class="auth-heading text-center">
        <h2 id="page-title">Crie sua conta</h2>
        <p>É rápido e fácil começar!</p>
      </div>
      <form id="register-form" class="auth-form" novalidate>
        <div class="field">
          <label class="sr-only" for="username">Nome de usuário</label>
          <div class="input-wrap">
            <svg class="field-icon" aria-hidden="true"><use href="/assets/icons/ui.svg#user"></use></svg>
            <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Nome de usuário" minlength="3" maxlength="30" required aria-describedby="username-error">
          </div>
          <p id="username-error" class="field-error" hidden></p>
        </div>
        <div class="field">
          <label class="sr-only" for="email">Endereço de e-mail</label>
          <div class="input-wrap">
            <svg class="field-icon" aria-hidden="true"><use href="/assets/icons/ui.svg#mail"></use></svg>
            <input id="email" name="email" type="email" autocomplete="email" inputmode="email" placeholder="Endereço de e-mail" maxlength="254" required aria-describedby="email-error">
          </div>
          <p id="email-error" class="field-error" hidden></p>
        </div>
        <div class="field">
          <label class="sr-only" for="password">Senha</label>
          <div class="input-wrap">
            <svg class="field-icon" aria-hidden="true"><use href="/assets/icons/ui.svg#lock"></use></svg>
            <input id="password" name="password" type="password" autocomplete="new-password" placeholder="Senha" minlength="8" maxlength="128" required aria-describedby="password-error">
            <button class="visibility-button flex items-center justify-center" type="button" data-toggle-password="password" aria-label="Mostrar senha" aria-pressed="false"><svg aria-hidden="true"><use href="/assets/icons/ui.svg#eye"></use></svg></button>
          </div>
          <p id="password-error" class="field-error" hidden></p>
        </div>
        <div class="field">
          <label class="sr-only" for="confirm-password">Confirme a senha</label>
          <div class="input-wrap">
            <svg class="field-icon" aria-hidden="true"><use href="/assets/icons/ui.svg#lock"></use></svg>
            <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Confirme a senha" minlength="8" maxlength="128" required aria-describedby="confirm-password-error">
            <button class="visibility-button flex items-center justify-center" type="button" data-toggle-password="confirm-password" aria-label="Mostrar confirmação de senha" aria-pressed="false"><svg aria-hidden="true"><use href="/assets/icons/ui.svg#eye"></use></svg></button>
          </div>
          <p id="confirm-password-error" class="field-error" hidden></p>
        </div>
        <p id="register-error" class="form-error" role="alert" hidden></p>
        <button class="button button--primary submit-button w-full" type="submit">Cadastrar</button>
      </form>
      <p class="auth-footer text-center">Já tem uma conta?<a class="text-link" href="/tela-2.html">Entrar</a></p>
    </div>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <noscript><p class="noscript">Ative o JavaScript para criar sua conta.</p></noscript>
</body>
</html>
