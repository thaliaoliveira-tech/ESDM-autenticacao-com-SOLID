<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f9fe">
  <meta name="description" content="Organize as tarefas do seu dia com o Sintetiza. Crie tarefas e, quando precisar, importe conversas para gerar novas ações.">

  <link rel="stylesheet" href="/css/tokens.css">
